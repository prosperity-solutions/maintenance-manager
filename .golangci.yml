# golangci-lint v2 (docs/HANDOVER.md D12). Run: scripts/dev/t golangci-lint run
version: "2"
run:
  # Lint the tagged suites too (e2e on kind, envtest).
  build-tags: [e2e, envtest]
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.RemoveAll
        - (*os.File).Close
        - os.Remove
  exclusions:
    rules:
      # Test helpers run git and sh with variable arguments and write fixtures
      # with ordinary permissions.
      - path: (_test\.go|^test/)
        linters: [gosec]
        text: "G(101|204|30[146])"
