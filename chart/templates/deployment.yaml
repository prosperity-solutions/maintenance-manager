{{- if and (not .Values.editor.password) (not .Values.editor.existingSecret) }}
{{- fail "editor.password or editor.existingSecret is required: the editor has no default password. Set one with --set editor.password=... or point editor.existingSecret at a Secret with the key editor-password." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mm.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mm.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the password or token changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mm.name" . }}
      automountServiceAccountToken: true # the controller talks to the API server
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread across zones and nodes, but never refuse to schedule: kind and
      # single-node clusters have neither.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mm.selectorLabels" . | nindent 14 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "mm.selectorLabels" . | nindent 20 }}
      containers:
        - name: maintenance-manager
          image: {{ include "mm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --arming-lead-time={{ .Values.armingLeadTime }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            - name: MM_EDITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mm.editorSecret" . }}
                  key: editor-password
            - name: MM_BYPASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mm.name" . }}
                  key: bypass-token
                  optional: true
          ports:
            - name: authz
              containerPort: 9001
            - name: editor
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30 # 60 s budget
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
