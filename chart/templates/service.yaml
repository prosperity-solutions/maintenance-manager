apiVersion: v1
kind: Service
metadata:
  name: {{ include "mm.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mm.selectorLabels" . | nindent 4 }}
  ports:
    - name: authz
      port: 9001
      targetPort: authz
      appProtocol: kubernetes.io/h2c
    - name: editor
      port: 8080
      targetPort: editor
    - name: metrics
      port: 8081
      targetPort: metrics
