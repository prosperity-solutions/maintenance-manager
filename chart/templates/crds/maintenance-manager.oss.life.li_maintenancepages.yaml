---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: maintenance-manager
  name: maintenancepages.maintenance-manager.oss.life.li
spec:
  group: maintenance-manager.oss.life.li
  names:
    categories:
    - maintenance-manager
    kind: MaintenancePage
    listKind: MaintenancePageList
    plural: maintenancepages
    shortNames:
    - mmp
    singular: maintenancepage
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'MaintenancePage is what users see: an HTML template plus localized
          texts.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MaintenancePageSpec is a page template and its texts per
              locale.
            properties:
              fallbackLocale:
                description: |-
                  FallbackLocale is used when no requested locale matches. It must be a key
                  of Locales.
                type: string
              html:
                description: |-
                  HTML is a Go html/template with .Title, .Message, .Locale, .Until,
                  .Continue and .Interstitial. Empty means the built-in default page. Only a safe subset
                  is allowed: text, {{.Field}}, if/else, with, and the functions eq, ne,
                  lt, le, gt, ge, and, or, not and len; no range, template, define, block,
                  variables or other functions. A page outside it is invalid and visitors
                  get the built-in page.
                maxLength: 65536
                type: string
              locales:
                additionalProperties:
                  description: PageText is the localized text of a page.
                  properties:
                    continueLabel:
                      description: |-
                        ContinueLabel is the text of the interstitial's button. Empty means a
                        built-in translation for the locale's language ("Weiter" for de), or
                        "Continue".
                      maxLength: 64
                      pattern: ^[^\r\n]*$
                      type: string
                    message:
                      maxLength: 4096
                      type: string
                    title:
                      maxLength: 256
                      type: string
                  type: object
                description: Locales maps a BCP 47 tag (e.g. "de-CH") to its texts.
                maxProperties: 32
                type: object
            required:
            - fallbackLocale
            - locales
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
