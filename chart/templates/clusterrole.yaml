# Cluster-wide: read routes and their parents, and own SecurityPolicies and
# EnvoyExtensionPolicies in app namespaces. docs/HANDOVER.md §11.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mm.name" . }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways, listenersets]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.x-k8s.io]
    resources: [xlistenersets]
    verbs: [get, list, watch]
  # Read every SecurityPolicy and EnvoyExtensionPolicy (conflicts, §5.3) and
  # create ours; change or delete only ours, which always have this one name.
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies, envoyextensionpolicies]
    verbs: [get, list, watch, create]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies, envoyextensionpolicies]
    resourceNames: [{{ printf "mm-%s" (sha256sum .Release.Namespace | trunc 8) }}]
    verbs: [update, patch, delete]
  # targetSelectors with namespaces.from: Selector match on namespace labels.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mm.name" . }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mm.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mm.name" . }}
    namespace: {{ .Release.Namespace }}
