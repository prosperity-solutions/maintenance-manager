{{- /* Rendered only when it holds something: the editor password (unless an
     existing Secret supplies it) or the bypass token. */ -}}
{{- if or (and .Values.editor.password (not .Values.editor.existingSecret)) .Values.bypass.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mm.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.editor.password (not .Values.editor.existingSecret) }}
  editor-password: {{ .Values.editor.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.bypass.token }}
  bypass-token: {{ .Values.bypass.token | b64enc | quote }}
  {{- end }}
{{- end }}
