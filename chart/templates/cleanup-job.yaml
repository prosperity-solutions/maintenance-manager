# Uninstall (§5.1): scale to 0, wait, then delete every SecurityPolicy and
# ReferenceGrant this install created. Its pod deliberately does not carry the
# Deployment's selector labels: it must not join the authz Service, the PDB or
# the spread constraints.
apiVersion: batch/v1
kind: Job
metadata:
  name: maintenance-manager-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: maintenance-manager-cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: maintenance-manager
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenance-manager-cleanup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mm.name" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: {{ include "mm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [cleanup]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
