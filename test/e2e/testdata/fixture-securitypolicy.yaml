# Before M4 there is no controller: tests attach this fixture SecurityPolicy
# and ReferenceGrant themselves, shaped like the one the controller will write
# (docs/HANDOVER.md §5.1). M4 deletes this file. NAMESPACE is the app's.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mm-fixture
  namespace: NAMESPACE
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web
  extAuth:
    failOpen: true
    timeout: 100ms
    includeRouteMetadata: true
    headersToExtAuth: [accept, accept-language, cookie, x-maintenance-manager-bypass]
    grpc:
      backendRefs:
        - name: maintenance-manager
          namespace: maintenance-manager
          port: 9001
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mm-from-NAMESPACE
  namespace: maintenance-manager
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: NAMESPACE
  to:
    - group: ""
      kind: Service
      name: maintenance-manager
