# E10: a WebSocket backend (jmalloc/echo-server echoes on /.ws), pinned by
# digest, behind a labelled HTTPRoute. NAMESPACE is replaced per test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws
  namespace: NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels: {app: ws}
  template:
    metadata:
      labels: {app: ws}
    spec:
      containers:
        - name: ws
          image: jmalloc/echo-server@sha256:c87f80de8dbb976a59b228fc9ecf257e0574c6f760c2f1c5f05f64c7ac7fbc1e
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ws
  namespace: NAMESPACE
spec:
  selector: {app: ws}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: NAMESPACE
  labels:
    e2e.maintenance-manager.oss.life.li/app: NAMESPACE
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - NAMESPACE.example.test
  rules:
    - backendRefs:
        - name: ws
          port: 80
